Name: BOPAVI
Summary: Jednostavna arkadna igra letenja s jednim dodirom
Description: |
  BOPAVI je offline arkadna igra letenja. Odaberi Bopija, Sovu ili
  Lisca, dodiruj zaslon za zamah krilima i izbjegavaj kamene prepreke.

  Prolazi kroz prepreke, skupljaj bobice i poboljšavaj vlastiti
  rezultat. Dostupne su tri težine, pauza i prilagodba pokreta.
  Rezultati se pohranjuju lokalno. Bez oglasa, korisničkih računa,
  analitike i potrebe za internetskom vezom.
