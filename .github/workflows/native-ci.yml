name: BOPAVI — Android / iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A superseded pull-request build should not occupy multiple emulators while
# a newer BOPAVI visual revision is being tested.
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  graphics:
    name: Render premium game art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow cairosvg
      - run: python tools/generate_images.py
      - name: Verify transparent sprite sizes, biomes and nine unique looks
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          sprites=[Image.open(Path('android/app/src/main/res/drawable-nodpi')/f'bopi{i}.png').convert('RGBA') for i in range(9)]
          assert all(im.size==(512,512) and im.getextrema()[3][0]==0 and im.getextrema()[3][1]==255 for im in sprites)
          assert len({im.tobytes() for im in sprites})==9
          worlds=[Image.open(Path('android/app/src/main/res/drawable-nodpi')/f'world{i}.png').convert('RGB') for i in range(8)]
          assert all(im.size==(960,1600) for im in worlds)
          assert len({im.resize((80,120)).tobytes() for im in worlds})==8
          # Guaranteed Android/iOS art identity includes all eight scenery
          # backdrops, not only bird bodies and detached animation wings.
          # Reject missing assets and accidental compression/size divergence.
          for world, android_image in enumerate(worlds):
              name=f'world{world}.png'
              android_path=Path('android/app/src/main/res/drawable-nodpi')/name
              ios_path=Path('ios/BOPAVI/Assets.xcassets')/f'World{world}.imageset'/name
              assert android_path.is_file() and ios_path.is_file(), (world,'missing biome')
              ios_image=Image.open(ios_path).convert('RGB')
              assert ios_image.size==(960,1600), (world,'wrong iOS canvas size')
              assert android_image.tobytes()==ios_image.tobytes(), (world,'mismatched pixels')
              assert android_path.read_bytes()==ios_path.read_bytes(), (world,'mismatched PNG')
          # Guard against the previous pale-yellow logo rasterization bug.
          logo=Image.open('android/app/src/main/res/drawable-nodpi/logo.png').convert('RGBA')
          pixels=logo.getdata()
          orange=sum(1 for r,g,b,a in pixels if a>180 and r>205 and 80<=g<200 and b<90)
          assert orange>400, f'BOPAVI orange lettering vanished: {orange} pixels'
          wings=[Image.open(Path('android/app/src/main/res/drawable-nodpi')/f'bopi{side}{skin}.png').convert('RGBA') for skin in range(9) for side in ('left','right')]
          assert len(wings)==18 and all(im.size==(512,512) and im.getbbox() for im in wings)
          # Both operating systems must ship the exact same pixels for every
          # character's body and each wing, not only the same resource names.
          for skin in range(9):
              for side in ('','left','right'):
                  name=f'bopi{side}{skin}.png'
                  android=Path('android/app/src/main/res/drawable-nodpi')/name
                  ios=Path('ios/BOPAVI/Assets.xcassets')/f'Bopi{side.capitalize()}{skin}.imageset'/name
                  assert android.is_file() and ios.is_file(), (skin,side,'missing asset')
                  assert Image.open(android).convert('RGBA').tobytes()==Image.open(ios).convert('RGBA').tobytes(), (skin,side,'different pixels')
          # Premium characters must have genuinely unique wings, not merely
          # different labels attached to Portantin's wing asset.
          for side in ('left','right'):
              portantin=Image.open(Path('android/app/src/main/res/drawable-nodpi')/f'bopi{side}6.png').convert('RGBA').tobytes()
              for skin in (7,8):
                  premium=Image.open(Path('android/app/src/main/res/drawable-nodpi')/f'bopi{side}{skin}.png').convert('RGBA').tobytes()
                  assert premium!=portantin, (skin,side,'duplicated Portantin wing')
          print('PASS: 9 body sprites, 18 Android/iOS pixel-identical animated wings and 8 biomes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-graphics
          path: |
            android/app/src/main/res/drawable/app_icon.png
            android/app/src/main/res/drawable-nodpi/hero.png
            android/app/src/main/res/drawable-nodpi/logo.png
            android/app/src/main/res/drawable-nodpi/splash.png
            ios/BOPAVI/Assets.xcassets/Hero.imageset/hero.png
            ios/BOPAVI/Assets.xcassets/Logo.imageset/
            ios/BOPAVI/Assets.xcassets/LaunchArt.imageset/
            android/app/src/main/res/drawable-nodpi/bopi*.png
            ios/BOPAVI/Assets.xcassets/BopiLeft*.imageset/
            ios/BOPAVI/Assets.xcassets/BopiRight*.imageset/
            android/app/src/main/res/drawable-nodpi/world*.png
            ios/BOPAVI/Assets.xcassets/World*.imageset/
            ios/BOPAVI/Assets.xcassets/Bopi*.imageset/
          if-no-files-found: error
  source-audit:
    name: Privacy and asset audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python tests/test_native_files.py
      - run: python -m compileall -q tools tests
      - name: Check no paywall or network permissions
        run: |
          ! grep -R -E '^[[:space:]]*(import (android.webkit|WebKit|StoreKit)|<uses-permission[^>]*INTERNET)' android/app/src/main ios/BOPAVI --include='*.kt' --include='*.swift' --include='*.xml'
  android:
    name: Android APK + AAB
    needs: [graphics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-graphics
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install 'platforms;android-36' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Lint, JVM unit tests, compile APK and unsigned release AAB
        working-directory: android
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Verify Play API 36 and unsigned bundle structure
        run: python tools/verify_play_release.py --aab android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Android-AAB-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
  android-smoke:
    name: Android home, gameplay and collision visual QA
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: qa/apk
      - name: Enable KVM acceleration on hosted runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable; emulator may boot slowly."
          fi
      - name: Set up native Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Google APIs Android 35 is known to install on hosted runners.
          # Restart only a confirmed hung Pixel Launcher, then verify real pilot cards:
          # the AOSP default system image failed to unpack on GitHub hosts.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: sh tools/qa_android_emulator.sh
      - name: Preserve Android QA screenshots and UI hierarchy on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Android-visual-flow
          path: |
            qa/screenshots/*.png
            qa/screenshots/*.xml
          if-no-files-found: warn
  play-listing:
    name: Package authentic Google Play preview assets
    needs: [graphics, android-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-graphics
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: QA-Android-visual-flow
          path: qa/screenshots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python tools/create_play_listing_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Google-Play-listing
          path: dist/BOPAVI-Google-Play-listing-v0.1.31.zip
          if-no-files-found: error
  android16-smoke:
    name: Android 16 API36 system image smoke
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: qa/apk
      - name: Enable Android KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify UI and navigation on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: sh tools/qa_android_emulator.sh
      - name: Preserve Android16 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Android16-visual-flow
          path: |
            qa/screenshots/*.png
            qa/screenshots/*.xml
          if-no-files-found: warn
  ios:
    name: iOS simulator + unsigned device build
    needs: [graphics]
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-graphics
          path: .
      - name: Build simulator release
        run: |
          xcodebuild -project ios/BOPAVI.xcodeproj -scheme BOPAVI -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/BOPAVI-sim" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/BOPAVI-sim/Build/Products/Release-iphonesimulator/BOPAVI.app" BOPAVI-iOS-Simulator.zip
      - name: iOS simulator launch smoke and screenshot
        run: |
          UDID="$(xcrun simctl list -j devices available | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for ds in d["devices"].values() for x in ds if "iPhone" in x["name"] and x.get("isAvailable",True)))')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/BOPAVI-sim/Build/Products/Release-iphonesimulator/BOPAVI.app"
          xcrun simctl launch "$UDID" com.brendigo.bopavi
          sleep 4
          xcrun simctl io "$UDID" screenshot BOPAVI-iOS-home.png
          test -s BOPAVI-iOS-home.png
          xcrun simctl shutdown "$UDID"
      - uses: actions/upload-artifact@v4
        with:
          name: QA-iOS-home-screenshot
          path: BOPAVI-iOS-home.png
          if-no-files-found: error
      - name: Core physics collision regression on iOS
        run: |
          swiftc -O ios/BOPAVI/BopaviCore.swift ios/BOPAVI/ProgressStore.swift tests/SwiftParity.swift -o "$RUNNER_TEMP/bopavi-core-tests"
          "$RUNNER_TEMP/bopavi-core-tests" | tail -n 1
      - name: Verify legacy save migration and haptics round-trip
        run: |
          swiftc -O ios/BOPAVI/BopaviCore.swift ios/BOPAVI/ProgressStore.swift tests/SwiftSaves.swift -o "$RUNNER_TEMP/bopavi-save-tests"
          "$RUNNER_TEMP/bopavi-save-tests" | tail -n 1
      - name: Compile unsigned iPhone device target
        run: |
          xcodebuild -project ios/BOPAVI.xcodeproj -scheme BOPAVI -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/BOPAVI-device" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/BOPAVI-device/Build/Products/Release-iphoneos/BOPAVI.app" BOPAVI-iOS-unsigned-device.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-iOS-builds
          path: |
            BOPAVI-iOS-Simulator.zip
            BOPAVI-iOS-unsigned-device.zip
          if-no-files-found: error
  publish:
    name: GitHub Release v0.1.31
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [graphics, source-audit, android, android-smoke, android16-smoke, ios, play-listing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: BOPAVI-*
          merge-multiple: true
      - name: Verify packaged artifacts
        run: |
          test -s dist/app-debug.apk
          test -s dist/app-release.aab
          test -s dist/BOPAVI-Google-Play-listing-v0.1.31.zip
          test -s dist/BOPAVI-iOS-Simulator.zip
          test -s dist/BOPAVI-iOS-unsigned-device.zip
      - name: Publish first GitHub release after passing builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.31 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.1.31 exists: no duplicate release.'
            exit 0
          fi
          gh release create v0.1.31 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'BOPAVI v0.1.31 — precise seamless marathon flight' --prerelease \
            --notes 'v0.1.31: Android/iOS Double-precision obstacle positioning through endless level boundaries, plus regression tests; API 36 and previous privacy protections remain. Razvojni AAB u ovom GitHub izdanju namjerno je NEPOTPISAN i ne može se izravno prenijeti u Play Console. Uključeni su stvarni Android emulator screenshotovi, 512px ikona, 1024x500 grafika i dokumentacija. Potpisivanje na GitHubu je isključeno; javni release sadrži nepotpisani AAB, a eventualno privatno potpisivanje radi izdavač izvan GitHuba. CI pokriva lint, Kotlin/Swift testove, Android emulator, iOS simulator, privatnost, APK/AAB i iOS build. Ne tvrdi se potvrđena objava u trgovini.'