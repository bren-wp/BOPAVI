name: BOPAVI — Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A superseded pull-request build should not occupy multiple emulators while
# a newer BOPAVI visual revision is being tested.
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  graphics:
    name: Render and verify Android art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow cairosvg
      - run: python tools/generate_images.py
      - run: python tests/test_launcher_premium.py
      - run: python tests/test_approved_bopi_source.py
      - run: python tools/verify_pilot_sprite_anatomy.py
      - run: python tests/test_world_storybook.py
      - name: Verify nine pilots and eight Android worlds
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res/drawable-nodpi')
          for i in range(9):
              for name in (f'bopi{i}',f'bopileft{i}',f'bopiright{i}',f'bopiportrait{i}'):
                  with Image.open(root/f'{name}.png') as im:
                      assert im.size==(512,512) and im.convert('RGBA').getbbox(),name
          unique=set()
          for i in range(8):
              with Image.open(root/f'world{i}.png') as im:
                  assert im.size==(960,1600),i
                  unique.add(im.resize((80,120)).convert('RGB').tobytes())
          assert len(unique)==8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-graphics
          path: android/app/src/main/res/
          if-no-files-found: error
  source-audit:
    name: Privacy and asset audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Generate and validate original 48-second offline soundtrack
        run: |
          python tools/generate_audio.py
          python tools/verify_audio.py
      - run: python tests/test_native_files.py
      - run: python tests/test_hr_ui_contract.py
      - run: python tests/test_reference_navigation.py
      - run: python tests/test_world_camera_coverage.py
      - run: python tests/test_reference_hud_geometry.py
      - run: python tests/test_reference_flight_left_rail.py
      - run: python tests/test_reference_bopi_import.py
      - run: python tests/test_android_emulator_transport_gate.py
      - run: python tests/test_responsive_smoke_contract.py
      - run: python tests/test_premium_result_layout.py
      - run: python tests/test_release_screenshot_states.py
      - run: sh -n tools/qa_android_emulator.sh
      - run: python tools/audit_native_dead_code.py
      - run: python tests/test_release_contract.py
      - run: python tests/test_sync_release_docs.py
      - run: python tests/test_store_claims.py
      - run: python tests/test_marketing_readme.py
      - run: python tests/test_cleanup_legacy_releases.py
      - run: python tests/test_native_lifecycle.py
      - run: python tests/test_audio_focus_contract.py
      - run: python tests/test_food_save_contract.py
      - run: python tests/test_native_perf_save_contract.py
      - run: python tests/test_play_listing_asset_source.py
      - run: python tests/test_collision_overlay_contract.py
      - run: python tests/test_crash_triage_contract.py
      - run: python tests/test_release_publish_guard.py
      - name: Require a new version for every pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Documentation/tests-only PRs do not change a distributed binary.
          # Keep the version-bump gate for every product/runtime/asset edit.
          pr="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          changed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --paginate --jq '.[].filename')"
          if ! printf '%s\n' "$changed" | grep -Ev '^(docs/|tests/|android/app/src/test/|README\.md$|\.github/workflows/native-ci\.yml$|tools/cleanup_legacy_releases\.py$)' | grep -q .; then
            echo "Metadata/tests-only PR: release version remains unchanged"
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          python3 - "$latest" <<'PY'
          import re,sys
          from pathlib import Path
          gradle=Path("android/app/build.gradle.kts").read_text()
          current=re.search(r'versionName\s*=\s*"(\d+\.\d+\.\d+)"',gradle)
          assert current, "Android versionName missing"
          released=sys.argv[1].removeprefix("v")
          def parts(v): return tuple(int(x) for x in v.split("."))
          if parts(current.group(1))<=parts(released):
              raise SystemExit(f"FAIL: New PR must bump release version beyond latest v{released}, got v{current.group(1)}")
          print(f"PASS: New version v{current.group(1)} exceeds last public release v{released}")
          PY
      - run: python -m compileall -q tools tests
      - name: Check no paywall or network permissions
        run: |
          ! grep -R -E '^[[:space:]]*(import (android.webkit|WebKit|StoreKit)|<uses-permission[^>]*INTERNET)' android/app/src/main --include='*.kt' --include='*.swift' --include='*.xml'
  android:
    name: Android APK + AAB
    needs: [graphics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-graphics
          path: android/app/src/main/res
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install 'platforms;android-36' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Rebuild original relaxing offline soundtrack into Android resources
        run: |
          python3 tools/generate_audio.py
          python3 tools/verify_audio.py
      - name: Lint, JVM unit tests, compile APK and unsigned release AAB
        working-directory: android
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Verify Play API 36 and unsigned bundle structure
        run: python tools/verify_play_release.py --aab android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Android-AAB-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
  android-smoke:
    name: Android home, gameplay and collision visual QA
    needs: [android]
    runs-on: ubuntu-latest
    # Allow one clean emulator restart ONLY after verified ADB transport loss.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: qa/apk
      - name: Enable KVM acceleration on hosted runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable; emulator may boot slowly."
          fi
      - name: Verify and repair API35 system image before emulator boot
        run: bash tools/prepare_android_emulator_image.sh 35
      - name: Set up native Android emulator
        id: api35_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Google APIs Android 35 is known to install on hosted runners.
          # Restart only a confirmed hung Pixel Launcher, then verify real pilot cards:
          # the AOSP default system image failed to unpack on GitHub hosts.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: BOPAVI_VIEWPORT_QA=1 sh tools/qa_android_emulator.sh
      - name: Save first emulator diagnostic and reset disconnected device
        if: ${{ steps.api35_primary.outcome == 'failure' && hashFiles('qa/screenshots/adb-transport-offline.retry') != '' }}
        run: |
          mkdir -p qa/first-emulator-attempt
          cp -a qa/screenshots/. qa/first-emulator-attempt/
          rm -f qa/screenshots/*
          adb kill-server || true
          rm -rf "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd" "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.ini"
      - name: Retry full Android 15 QA only for confirmed offline ADB
        id: api35_transport_retry
        if: ${{ steps.api35_primary.outcome == 'failure' && hashFiles('qa/first-emulator-attempt/adb-transport-offline.retry') != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: BOPAVI_VIEWPORT_QA=1 sh tools/qa_android_emulator.sh
      - name: Require a complete passing Android 15 gameplay suite
        if: ${{ always() }}
        env:
          PRIMARY: ${{ steps.api35_primary.outcome }}
          RETRY: ${{ steps.api35_transport_retry.outcome }}
        run: |
          set -euo pipefail
          if [ "$PRIMARY" = success ]; then
            echo 'PASS: original Android 15 interactive gameplay QA'
            exit 0
          fi
          if [ -f qa/first-emulator-attempt/adb-transport-offline.retry ] &&
             [ "$RETRY" = success ]; then
            echo 'PASS: full Android 15 gameplay QA on a fresh emulator'
            exit 0
          fi
          echo "FAIL: Android 15 primary=$PRIMARY retry=$RETRY" >&2
          echo 'Real application defects and unverified or repeated transport failures must block release.' >&2
          exit 1
      - name: Preserve Android QA screenshots and UI hierarchy on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Android-visual-flow
          path: |
            qa/screenshots/*.png
            qa/screenshots/*.xml
            qa/screenshots/*.txt
            qa/screenshots/*.retry
          if-no-files-found: warn
          # A retry replaces incomplete screenshots uploaded by a failed attempt.
          overwrite: true
      # Preserve offline evidence separately so the production screenshot
      # archive still has the exact flat paths required by Play-listing QA.
      - name: Save original failed-emulator files in a separate artifact
        if: ${{ always() && hashFiles('qa/first-emulator-attempt/adb-transport-offline.retry') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QA-Android35-ADB-transport-diagnostic
          path: qa/first-emulator-attempt/
          if-no-files-found: error
  play-listing:
    name: Package authentic Google Play preview assets
    needs: [graphics, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-graphics
          path: android/app/src/main/res
      - name: Require one unambiguous Android QA screenshot archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=QA-Android-visual-flow" \
            --jq '[.artifacts[] | select(.name == "QA-Android-visual-flow" and (.expired | not))] | length')"
          if [ "$total" != 1 ]; then
            echo "::error::Expected exactly one current QA-Android-visual-flow artifact, got $total. Retry must replace partial screenshot upload."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: QA-Android-visual-flow
          path: qa/screenshots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow cairosvg
      - run: python tools/create_play_listing_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: BOPAVI-Google-Play-listing
          path: dist/BOPAVI-Google-Play-listing-v*.zip
          if-no-files-found: error
  android16-smoke:
    name: Android 16 API36 system image smoke
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BOPAVI-Android-APK
          path: qa/apk
      - name: Enable Android KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify API36 image, falling back to standard AOSP when necessary
        id: image36
        run: bash tools/prepare_android_emulator_image.sh 36
      - name: Verify UI and navigation on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ steps.image36.outputs.image_target }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: sh tools/qa_android_emulator.sh
      - name: Preserve Android16 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Android16-visual-flow
          path: |
            qa/screenshots/*.png
            qa/screenshots/*.xml
            qa/screenshots/*.txt
          if-no-files-found: warn
          overwrite: true
  publish:
    name: Publish versioned GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [graphics, source-audit, android, android-smoke, android16-smoke, play-listing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: BOPAVI-*
          merge-multiple: true
      # These images are unmodified pixels captured by actual CI emulators,
      # not the conceptual BOPAVI marketing reference renders.
      - uses: actions/download-artifact@v4
        with:
          name: QA-Android-visual-flow
          path: dist/real-screenshots/android
      - name: Stage authentic Android screenshots for README gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          import struct
          captures = {
              'dist/real-screenshots/android/android-home.png':'BOPAVI-Android-Home.png',
              'dist/real-screenshots/android/android-gameplay-ready.png':'BOPAVI-Android-Flight-Preview.png',
              'dist/real-screenshots/android/android-gameplay-active.png':'BOPAVI-Android-Flight-Active.png',
              'dist/real-screenshots/android/android-result.png':'BOPAVI-Android-Results.png'
          }
          for src, dest in captures.items():
              source=Path(src)
              if not source.is_file():
                  raise SystemExit(f'Missing authentic emulator screenshot: {src}')
              with source.open('rb') as handle:
                  header=handle.read(24)
              if len(header)!=24 or header[:8]!=bytes.fromhex('89504e470d0a1a0a') or header[12:16]!=b'IHDR':
                  raise SystemExit(f'Invalid PNG evidence: {src}')
              width,height=struct.unpack('>II',header[16:24])
              if width < 320 or height < 600 or height <= width or source.stat().st_size < 2000:
                  raise SystemExit(f'Invalid portrait device capture: {src} ({width}x{height})')
              copyfile(source,Path('dist')/dest)
              print(f'PASS: real screenshot {dest} ({width}x{height})')
          # The preceding v0.1.55 release accidentally published identical
          # preflight/active PNGs. Distinct pixel frames are required evidence.
          # These images are produced by the same adb screencap encoder, so
          # a byte-identical output proves no new game frame was recorded.
          from hashlib import sha256
          ready=Path('dist/BOPAVI-Android-Flight-Preview.png')
          active=Path('dist/BOPAVI-Android-Flight-Active.png')
          if sha256(ready.read_bytes()).digest()==sha256(active.read_bytes()).digest():
              raise SystemExit('Active gameplay screenshot is identical to idle flight; release blocked')
          print('PASS: distinct actual preflight and active flight PNG frames')
          results=Path('dist/BOPAVI-Android-Results.png')
          for earlier in (ready,active):
              if sha256(results.read_bytes()).digest()==sha256(earlier.read_bytes()).digest():
                  raise SystemExit(f'Results screenshot duplicates gameplay screenshot: {earlier.name}; release blocked')
          print('PASS: results UI screenshot distinct from both idle and active gameplay')
          PY
      - name: Verify exact-version assets and explicitly unsigned Android bundle
        run: |
          set -euo pipefail
          tag="$(python tools/release_metadata.py --tag)"
          play_archive="$(python tools/release_metadata.py --play-archive)"
          test -s dist/app-debug.apk
          test -s dist/app-release.aab
          test -s "dist/$play_archive"
          python tools/verify_play_release.py --aab dist/app-release.aab
          echo "BOPAVI_TAG=$tag" >> "$GITHUB_ENV"
          echo "BOPAVI_PLAY_ARCHIVE=$play_archive" >> "$GITHUB_ENV"
      - name: Generate SHA-256 checksums for every release artifact
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            app-debug.apk \
            app-release.aab \
            "$BOPAVI_PLAY_ARCHIVE" \
            BOPAVI-Android-Home.png \
            BOPAVI-Android-Flight-Preview.png \
            BOPAVI-Android-Flight-Active.png \
            BOPAVI-Android-Results.png > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
      - name: Publish only a tested commit with verified binaries and real screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$BOPAVI_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              # Never rewrite a released tag for documentation-only merges.
              git fetch --no-tags --depth=1 origin "$existing"
              if git diff --name-only "$existing" "$GITHUB_SHA" | python3 tests/release_publish_guard.py; then
                echo "Skipping duplicate $tag publication after metadata-only changes."
                exit 0
              fi
              echo "::error::Release $tag targets $existing, not this product commit $GITHUB_SHA. Increase version."
              exit 1
            fi
            existing_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in app-debug.apk app-release.aab "$BOPAVI_PLAY_ARCHIVE" BOPAVI-Android-Home.png BOPAVI-Android-Flight-Preview.png BOPAVI-Android-Flight-Active.png BOPAVI-Android-Results.png SHA256SUMS.txt; do
              if ! grep -Fxq "$file" <<< "$existing_assets"; then
                echo "::error::Existing $tag release is missing $file."
                exit 1
              fi
            done
            echo "Verified previous publication of $tag at the tested commit with all eight Android distribution artifacts."
            exit 0
          fi
          python tools/release_notes.py > dist/release-notes.md
          gh release create "$tag" \
            dist/app-debug.apk \
            dist/app-release.aab \
            "dist/$BOPAVI_PLAY_ARCHIVE" \
            dist/BOPAVI-Android-Home.png \
            dist/BOPAVI-Android-Flight-Preview.png \
            dist/BOPAVI-Android-Flight-Active.png \
            dist/BOPAVI-Android-Results.png \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BOPAVI $tag — Android" \
            --notes-file dist/release-notes.md

  legacy-retention:
    name: Preserve every stable release, prune only old v0.x
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bopavi-legacy-release-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: python tests/test_cleanup_legacy_releases.py
      - name: Verify published release, SHA-256 checksums and prune old pre-v1 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python tools/release_metadata.py --tag)"
          python tools/cleanup_legacy_releases.py --repo "$GITHUB_REPOSITORY" --new-tag "$tag" --apply

  release-docs:
    name: Sync only verified stable Android release documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh published versions after successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python tools/release_metadata.py --tag)"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/bopavi-release-pages.json"
          python tools/sync_release_docs.py --releases "$RUNNER_TEMP/bopavi-release-pages.json" --expected-tag "$tag"
          if ! git diff --quiet -- CHANGELOG.md docs/product/FEATURE-MATRIX.md docs/product/CURRENT_SCREENS.md docs/play/STORE-LISTING-hr-HR.md docs/play/RELEASE-CHECKLIST.md docs/release/NEXT.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md docs/product/FEATURE-MATRIX.md docs/product/CURRENT_SCREENS.md docs/play/STORE-LISTING-hr-HR.md docs/play/RELEASE-CHECKLIST.md docs/release/NEXT.md
            git commit -m "docs(release): sync published $tag [skip ci]"
            git push origin HEAD:main
          else
            echo 'Published release documentation is already current'
          fi
