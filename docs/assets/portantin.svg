<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-65 -65 130 130" role="img" aria-labelledby="title desc">
  <title id="title">Portantin — krilati nosač sa suputnikom</title>
  <desc id="desc">Dobrodušni krilati čovječuljak s plavim naočalama, kirurškom maskicom i zaštitnim rukavicama nosi drugog čovječuljka sigurno na leđima.</desc>
  <defs>
    <linearGradient id="coat" x2=".95" y2="1"><stop stop-color="#49bfd3"/><stop offset="1" stop-color="#206b99"/></linearGradient>
    <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#f6fffa"/><stop offset=".52" stop-color="#b3e6f4"/><stop offset="1" stop-color="#67a7db"/></linearGradient>
    <linearGradient id="face" x2=".8" y2="1"><stop stop-color="#ffe7ae"/><stop offset="1" stop-color="#eaa577"/></linearGradient>
  </defs>
