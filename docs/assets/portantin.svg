    <path d="M-52 -32 Q-33 -23 -22 6 M-50 -14 Q-35 -8 -21 10 M-44 2 Q-30 2 -19 12" fill="none" stroke="#74bce3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
