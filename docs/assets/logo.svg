<svg xmlns="http://www.w3.org/2000/svg" width="844" height="352" viewBox="-42 -37 844 352" role="img" aria-label="BOPAVI">
  <title>BOPAVI</title>
  <desc>Locally rendered winged crown logo with orange BOPA and bright blue Vi enamel letters.</desc>
  <defs>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff994"/><stop offset=".31" stop-color="#ffd42d"/>
      <stop offset=".64" stop-color="#ff9214"/><stop offset="1" stop-color="#ff4e08"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d0fdff"/><stop offset=".28" stop-color="#5febff"/>
      <stop offset=".7" stop-color="#05bcfb"/><stop offset="1" stop-color="#0861dd"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff9b2"/><stop offset=".42" stop-color="#ffcd16"/>
      <stop offset="1" stop-color="#f27907"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".69" stop-color="#e8f5ff"/>
      <stop offset="1" stop-color="#a2c3fe"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9a455"/><stop offset=".53" stop-color="#a45c2b"/>
      <stop offset="1" stop-color="#67321e"/>
    </linearGradient>
  </defs>
  <!-- Owner's tall 3D wordmark: scale the ORIGINAL vector geometry before
       rasterization, never stretch a low-resolution PNG at runtime. -->
  <g transform="scale(1 1)">
  <!-- Wings are behind both lettering groups. Each feather is locally drawn. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(0 37)">
    <path d="M165 111Q99 100 28 73Q20 114 96 139Q63 138 31 128Q49 165 112 171Q79 179 45 167Q91 199 172 151Z"
      fill="#08245a" stroke="#061d50" stroke-width="14"/>
    <path d="M164 105Q98 93 32 82Q36 116 111 138Q70 136 39 132Q72 163 128 162Q89 176 52 173Q112 189 172 146Z"
      fill="url(#feather)" stroke="#4d87ce" stroke-width="3"/>
    <path d="M595 111Q661 100 732 73Q740 114 664 139Q697 138 729 128Q711 165 648 171Q681 179 715 167Q669 199 588 151Z"
      fill="#08245a" stroke="#061d50" stroke-width="14"/>
    <path d="M596 105Q662 93 728 82Q724 116 649 138Q690 136 721 132Q688 163 632 162Q671 176 708 173Q648 189 588 146Z"
      fill="url(#feather)" stroke="#4d87ce" stroke-width="3"/>
    </g>
    <!-- Wooden plaque and leaves under the raised enamel lettering. -->
    <g transform="translate(0 50)">
    <path d="M160 151Q366 204 602 151L589 193Q379 223 175 190Z"
      fill="#532716" stroke="#36201b" stroke-width="11"/>
    <path d="M169 153Q367 194 591 154L582 185Q373 211 177 184Z"
      fill="url(#wood)" stroke="#edb172" stroke-width="4"/>
    <path d="M175 165Q368 207 580 168" fill="none" stroke="#ffcd7b" stroke-opacity=".7" stroke-width="4"/>
    <path d="M168 181Q133 160 104 175Q107 205 151 208Q131 218 126 222Q161 222 182 195"
      fill="#3bad25" stroke="#075725" stroke-width="6"/>
    <path d="M590 181Q627 160 655 175Q652 205 608 208Q629 218 635 222Q599 222 580 195"
      fill="#3bad25" stroke="#075725" stroke-width="6"/>
    <path d="M127 182Q150 185 167 194M634 182Q613 185 596 194"
      fill="none" stroke="#a7f35d" stroke-width="4"/>
    </g>
    <!-- Dark crown silhouette, warm gold face and three tiny jewels. -->
    <path d="M325 63L331 17L363 42L389 7L415 41L445 18L450 62L438 83Q390 95 341 82Z"
      fill="#071a55" stroke="#07133c" stroke-width="13"/>
    <path d="M331 61L338 24L363 48L389 16L413 49L438 26L443 61L432 76Q389 85 347 75Z"
      fill="url(#crownGold)" stroke="#fff19b" stroke-width="4"/>
    <circle cx="337" cy="28" r="5" fill="#fff7bb"/><circle cx="388" cy="16" r="6" fill="#fff7bb"/>
    <circle cx="439" cy="29" r="5" fill="#fff7bb"/>
  </g>
  <!-- Individually rebuilt closed B/O/P/A contours and negative counters.
       Exactly two B counters, and one O/P/A counter: no self-intersecting
       zigzags, missing serifs or disappearing colored enamel surfaces.
       Outer viewBox adds bleed for all crown, wing and shadow strokes. -->
  <defs>
    <g id="ownerWarm">
    <path id="ownerB" fill-rule="evenodd" d="M 120 151 C 140 139 157 131 173 124 C 197 113 213 111 226 124 C 240 137 238 161 222 177 C 241 184 250 199 247 220 C 242 243 206 259 152 273 C 145 272 141 257 136 231 L 120 154 Z M 172 150 C 177 144 184 143 188 149 C 194 156 191 166 183 172 C 177 177 172 169 169 160 C 167 155 168 152 172 150 Z M 184 201 C 190 196 197 197 201 202 C 206 209 202 218 194 222 C 188 225 183 220 181 214 C 179 207 181 203 184 201 Z"/>
    <path id="ownerO" fill-rule="evenodd" d="M 291 114 C 326 109 345 137 345 173 C 346 208 328 235 300 237 C 271 240 246 222 243 190 C 239 156 257 120 291 114 Z M 291 151 C 301 147 308 158 309 174 C 311 187 305 197 297 199 C 288 201 282 189 280 176 C 278 163 283 153 291 151 Z"/>
    <path id="ownerP" fill-rule="evenodd" d="M 354 123 C 363 112 373 106 389 103 C 414 99 433 110 440 129 C 450 150 440 176 425 187 C 416 195 404 199 390 198 L 393 225 C 394 233 386 239 376 240 L 358 239 C 353 237 351 222 351 205 L 348 131 C 348 126 350 124 354 123 Z M 389 136 C 399 131 406 139 408 148 C 410 157 402 165 392 165 C 386 164 386 153 386 146 C 386 142 387 138 389 136 Z"/>
    <path id="ownerA" fill-rule="evenodd" d="M 470 132 C 476 121 481 116 490 116 C 502 116 507 122 511 137 L 533 224 C 537 240 527 247 511 243 L 498 241 L 496 222 C 490 219 480 218 467 219 C 462 232 457 237 443 235 L 425 232 C 423 226 426 215 430 205 L 460 149 C 464 141 467 136 470 132 Z M 480 174 C 483 169 486 168 487 175 L 491 190 C 486 192 480 192 476 191 C 477 185 478 178 480 174 Z"/>
  </g>
    <!-- The blue V and lowercase i must be TWO distinct glyph contours. A
         single connected silhouette looked like W in real Android captures. -->
    <path id="ownerBlue" d="M528 115 Q551 108 560 130 L574 203 L601 130 Q607 114 621 118 L635 123 Q644 130 635 148 L591 248 Q585 264 566 261 L553 258 Q546 257 542 239 L520 135 Q517 118 528 115 Z"/>
    <path id="ownerI" d="M648 152 Q663 148 676 158 Q683 166 678 180 L653 259 Q648 274 630 271 L622 270 Q609 267 614 250 L639 171 Q642 158 648 152 Z"/>
  </defs>
  <g transform="translate(0 -12)" stroke-linecap="round" stroke-linejoin="round">
    <use href="#ownerWarm" transform="translate(0 11)" fill="#061b49" stroke="#061839" stroke-width="18"/>
    <use href="#ownerBlue" transform="translate(0 11)" fill="#061b49" stroke="#061839" stroke-width="18"/>
    <use href="#ownerI" transform="translate(0 11)" fill="#061b49" stroke="#061839" stroke-width="18"/>
    <use href="#ownerWarm" transform="translate(0 6)" fill="#a43a0b" stroke="#092659" stroke-width="13"/>
    <use href="#ownerBlue" transform="translate(0 6)" fill="#084c9a" stroke="#092659" stroke-width="13"/>
    <use href="#ownerI" transform="translate(0 6)" fill="#084c9a" stroke="#092659" stroke-width="13"/>
    <use href="#ownerWarm" fill="url(#goldText)" stroke="#8d320d" stroke-width="5"/>
    <use href="#ownerBlue" fill="url(#cyanText)" stroke="#055eac" stroke-width="5"/>
    <use href="#ownerI" fill="url(#cyanText)" stroke="#055eac" stroke-width="5"/>
    <path d="M157 135 Q169 123 196 122 M264 158 Q273 132 289 128 M372 129 Q385 116 409 120 M456 158 Q466 132 483 129"
       fill="none" stroke="#fffcc2" stroke-width="5" stroke-opacity=".74"/>
    <path d="M164 235 Q183 238 198 234 M263 205 Q276 226 297 227 M371 221 Q378 228 393 225 M505 234 Q517 241 529 236"
       fill="none" stroke="#8a2507" stroke-width="4" stroke-opacity=".47"/>
    <path d="M541 130Q549 119 555 133 M626 148Q645 126 663 141"
       fill="none" stroke="#e1fbff" stroke-width="4" stroke-opacity=".64"/>
    <!-- The separated round dot above the small blue i is an essential
         hand-painted owner logo feature; it is not a substituted font glyph. -->
    <ellipse cx="675" cy="119" rx="17" ry="17"
       fill="#19bdf9" stroke="#092553" stroke-width="9"/>
    <ellipse cx="669" cy="111" rx="5.5" ry="6.2"
       fill="#e7ffff" opacity=".80"/>
  </g>
  </g>
</svg>
